name: Python execution tests
on:
  pull_request:
    paths:
      - 'src/awfl/execution/**'
      - 'src/awfl/consumer/**'
      - 'src/awfl/response_handler/**'
      - 'tests/test_execution*.py'
      - 'tests/test_mcp_shared.py'
      - 'tests/test_native_runtime.py'
      - 'tests/test_patch.py'
      - 'tests/test_credential_rotation.py'
      - '.github/workflows/test-execution.yml'
  push:
    branches: [main]
    paths:
      - 'src/awfl/execution/**'
      - 'src/awfl/consumer/**'
      - 'src/awfl/response_handler/**'
      - 'tests/test_execution*.py'
      - 'tests/test_mcp_shared.py'
      - 'tests/test_native_runtime.py'
      - 'tests/test_patch.py'
      - 'tests/test_credential_rotation.py'
      - '.github/workflows/test-execution.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
